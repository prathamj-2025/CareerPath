<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerPath</title>
<meta name="description" content="CareerPath: pick a target role, learn the skills it needs, and prove them through assessment.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314532D'/%3E%3Cg fill='none' stroke='white' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 7 28 13 16 19 4 13Z'/%3E%3Cpath d='M9 16.5v5.2c0 2.2 3.1 4 7 4s7-1.8 7-4v-5.2'/%3E%3Cpath d='M28 13v7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F4F7F5;
    --surface-2: #EAF0EC;
    --surface-3: #E2E8E4;
    --ink: #14181A;
    --ink-2: #5F6B66;
    --ink-3: #6E7B75;
    --line: #E2E8E4;
    --line-strong: #CDD6D1;
    --accent: #14532D;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3ECE6;
    --star: #A9791C;
    --star-empty: #CDD6D1;
    --ok: #14532D;
    --ok-soft: #E3ECE6;
    --warn: #9A4B1B;
    --warn-soft: #F8EBE1;
    --bad: #A33A32;
    --bad-soft: #F9E8E6;
    --shadow: 0 1px 2px rgba(20,24,26,.06), 0 4px 12px rgba(20,24,26,.05);
    --radius: 14px;
    --radius-lg: 18px;
    --radius-btn: 12px;
    --press: rgba(20,24,26,.13);
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1311;
      --surface: #151C19;
      --surface-2: #1B2420;
      --surface-3: #232D28;
      --ink: #EEF4F0;
      --ink-2: #93A39B;
      --ink-3: #7D8D85;
      --line: #232D28;
      --line-strong: #34423B;
      --accent: #2F9461;
      --accent-ink: #0E1311;
      --accent-soft: #13251B;
      --star: #D8A93F;
      --star-empty: #34423B;
      --ok: #2F9461;
      --ok-soft: #13251B;
      --warn: #D08A4E;
      --warn-soft: #2A1E13;
      --bad: #E0736A;
      --bad-soft: #2B1715;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --press: rgba(238,244,240,.13);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1311;
    --surface: #151C19;
    --surface-2: #1B2420;
    --surface-3: #232D28;
    --ink: #EEF4F0;
    --ink-2: #93A39B;
    --ink-3: #7D8D85;
    --line: #232D28;
    --line-strong: #34423B;
    --accent: #2F9461;
    --accent-ink: #0E1311;
    --accent-soft: #13251B;
    --star: #D8A93F;
    --star-empty: #34423B;
    --ok: #2F9461;
    --ok-soft: #13251B;
    --warn: #D08A4E;
    --warn-soft: #2A1E13;
    --bad: #E0736A;
    --bad-soft: #2B1715;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --press: rgba(238,244,240,.13);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; line-height: 1.2; }
  h1 { font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
  h2 { letter-spacing: -.015em; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ---------- layout ---------- */
  /* The chrome is one horizontal bar across the top. A vertical rail costs 232px of
     width on every screen, and the content here is wide: tables, a roadmap with a
     leaderboard beside it, side-by-side draft comparisons. */
  #shell { display: flex; flex-direction: column; min-height: 100dvh; container-type: inline-size; }
  #sidebar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0 18px; min-height: 57px;
    display: flex; flex-direction: row; align-items: center; gap: 18px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  }
  .bar-left { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
  .bar-context {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
    color: var(--ink-2); background: var(--surface-2); border-radius: 20px; padding: 3px 10px;
    white-space: nowrap;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 26px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600; font-size: 13px;
  }
  .brand-mark svg { display: block; }
  .cert-seal { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 10px;
    border-radius: 14px; background: var(--accent); color: var(--accent-ink); }
  .brand-name { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  nav.side {
    display: flex; flex-direction: row; align-items: center; gap: 2px;
    flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none;
  }
  nav.side::-webkit-scrollbar { display: none; }
  .nav-item {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 7px 11px; border-radius: 7px; border: 0; background: none;
    color: var(--ink-2); font-size: 14px;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .nav-count {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    background: var(--surface-2); border-radius: 20px; padding: 1px 6px;
  }
  .nav-item[aria-current="true"] .nav-count { background: var(--surface); color: var(--accent); }

  .side-foot { display: flex; flex-direction: row; align-items: center; gap: 6px; flex: 0 0 auto; }
  .side-foot .divider { display: none; }
  .who {
    display: flex; align-items: center; gap: 9px; text-align: left;
    border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 8px; color: inherit;
  }
  .who:hover { background: var(--surface-2); }
  .who[aria-current="true"] { background: var(--accent-soft); }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
    background: var(--surface-3); color: var(--ink-2);
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
  }
  .who-name { font-size: 13.5px; font-weight: 500; line-height: 1.2; display: block; }
  .who-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.3; display: block; }

  /* The bar has to survive the docked assistant taking 360px off the shell. It sheds
     the context pill first, then the user's name, and finally puts the nav on its own
     row. Nothing is ever scrolled out of reach. */
  @container (max-width: 1120px) {
    .bar-context { display: none; }
  }
  @container (max-width: 1000px) {
    #sidebar { flex-wrap: wrap; padding-top: 9px; padding-bottom: 5px; row-gap: 4px; min-height: 0; }
    .bar-left { order: 1; }
    .side-foot { order: 2; margin-left: auto; }
    nav.side { order: 3; flex-basis: 100%; margin: 0 -6px; padding: 0 6px 4px; }
  }
  @container (max-width: 700px) {
    .who > span:last-child { display: none; }
    .who { padding: 4px; }
  }

  #main { flex: 1; min-width: 0; container-type: inline-size; }
  .page { max-width: 1120px; margin: 0 auto; padding: 26px 20px 64px; }
  .page-head { margin-bottom: 22px; }
  .eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-3); font-weight: 600; margin-bottom: 6px;
  }
  .page-head h1 { font-size: 25px; letter-spacing: -.02em; }
  /* No character cap on body text. A reading column is right for an article and wrong
     here: it leaves an empty strip down the right of every card and page, which reads
     as broken rather than deliberate. */
  .page-head .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; }

  /* ---------- primitives ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface);
    padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding-left: 8px; padding-right: 8px; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .icon-btn { padding: 6px; line-height: 0; }
  .icon-btn svg { display: block; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 20px;
    background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); }
  .tiny { font-size: 12.5px; }
  .divider { height: 1px; background: var(--line); border: 0; margin: 0; }

  .stars { display: inline-flex; gap: 1px; color: var(--star); letter-spacing: .5px; }
  .stars .off { color: var(--star-empty); }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .field input, .field select {
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  .bar { height: 6px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.grid th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-3); font-weight: 600; padding: 0 10px 8px; border-bottom: 1px solid var(--line);
  }
  table.grid td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr:last-child td { border-bottom: 0; }
  .scroll-x { overflow-x: auto; }

  /* ---------- auth ---------- */
  #auth { min-height: 100dvh; display: grid; grid-template-columns: 1.05fr 1fr; }
  .auth-aside {
    background: var(--accent); color: var(--accent-ink);
    padding: 44px 40px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
  }
  .auth-aside .brand-mark { background: rgba(255,255,255,.16); color: var(--accent-ink); }
  .auth-aside .brand-name { color: var(--accent-ink); }
  .auth-claim { font-size: 27px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; max-width: 14ch; }
  .auth-claim em { font-style: normal; opacity: .62; }
  .auth-points { display: flex; flex-direction: column; gap: 13px; font-size: 13.5px; opacity: .88; }
  .auth-points div { display: flex; gap: 10px; }
  .auth-points b { font-family: var(--mono); font-weight: 500; opacity: .6; }
  .auth-form-wrap { padding: 40px 32px; display: flex; align-items: center; justify-content: center; }
  .auth-form { width: 100%; max-width: 380px; }
  .auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; margin-bottom: 20px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: var(--shadow); }
  .demo-hint {
    margin-top: 18px; padding: 11px 13px; border: 1px dashed var(--line-strong);
    border-radius: 9px; font-size: 12.5px; color: var(--ink-2); background: var(--surface);
  }
  .err { color: var(--bad); font-size: 13px; }

  /* ---------- role picker ---------- */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .role-card {
    text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .role-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .role-card h3 { font-size: 16px; }
  .role-card .tag { font-size: 13px; color: var(--ink-2); }
  .role-card .n { font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: auto; padding-top: 6px; }

  /* ---------- roadmap ---------- */
  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 22px; }
  .summary-cell { background: var(--surface); padding: 13px 15px; }
  .summary-cell .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
  .summary-cell .v { font-family: var(--mono); font-size: 21px; font-weight: 500; margin-top: 3px; line-height: 1.1; }
  .summary-cell .v small { font-size: 13px; color: var(--ink-3); font-weight: 400; }

  .skill-row {
    display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
    padding: 14px 16px; background: var(--surface);
    width: 100%; text-align: left; font: inherit; color: inherit;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  }
  .skill-row:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
  .skill-row:last-child { border-bottom: 0; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
  .skill-list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .skill-row:hover { background: var(--surface-2); }
  .skill-name { font-weight: 500; font-size: 15px; }
  .skill-lens { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .skill-right { display: flex; align-items: center; gap: 12px; }

  /* ---------- content ---------- */
  .prose { max-width: none; }
  .prose p { margin-bottom: 13px; color: var(--ink); }
  .prose p:last-child { margin-bottom: 0; }
  .prose pre {
    font-family: var(--mono); font-size: 12.5px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto;
    margin: 0 0 13px; line-height: 1.5; white-space: pre;
  }
  .lesson-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .lesson-nav button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
    padding: 5px 11px; font-size: 13px; color: var(--ink-2);
  }
  .lesson-nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .lesson-nav button.done { border-color: var(--ok); color: var(--ok); }

  .q-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; }
  .q-stem { font-weight: 500; margin-bottom: 14px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; text-align: left;
    border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt .key {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
    border: 1px solid var(--line-strong); border-radius: 5px;
    width: 20px; height: 20px; flex: 0 0 20px; display: grid; place-items: center; margin-top: 1px;
  }
  .opt[data-state="chosen"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[data-state="chosen"] .key { border-color: var(--accent); color: var(--accent); }
  .opt[data-state="correct"] { border-color: var(--ok); background: var(--ok-soft); }
  .opt[data-state="wrong"] { border-color: var(--bad); background: var(--bad-soft); }
  .why { margin-top: 12px; padding: 11px 13px; border-radius: 8px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
  .why b { color: var(--ink); font-weight: 600; }
  .why p { margin-bottom: 9px; }
  .why p:last-child { margin-bottom: 0; }

  /* ---------- practice workspace ---------- */
  .ex { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .ex-prompt { font-weight: 500; margin-bottom: 11px; }
  .fl {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); font-weight: 600; display: block; margin-bottom: 5px;
  }
  .ex-schema, .ex-solution { margin-bottom: 11px; }
  .ex-schema pre, .ex-solution pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.55; margin: 0;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; overflow-x: auto; white-space: pre;
  }
  .ex-solution pre { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
  .ex-input {
    width: 100%; resize: vertical; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 10px 11px; font-size: 13.5px; line-height: 1.55; color: var(--ink);
  }
  .ex-input.code { font-family: var(--mono); font-size: 12.5px; }
  .ex-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .ex-input::placeholder { color: var(--ink-3); }
  .hint {
    font-size: 13px; color: var(--ink-2); padding: 9px 11px; border-radius: 8px;
    background: var(--warn-soft); border-left: 3px solid var(--warn);
  }
  .hint b { color: var(--warn); font-weight: 600; margin-right: 5px; }

  .check-panel {
    margin-top: 11px; padding: 12px 13px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface-2); font-size: 13.5px;
  }
  .check-panel.ok { border-color: var(--ok); background: var(--ok-soft); }
  .check-panel.warn { border-color: var(--warn); background: var(--warn-soft); }
  .check-panel.bad { border-color: var(--bad); background: var(--bad-soft); }
  .check-panel.ok b { color: var(--ok); }
  .check-panel.warn b { color: var(--warn); }
  .check-panel.bad b { color: var(--bad); }
  .crits { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .crit { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); }
  .crit .mark {
    font-family: var(--mono); font-size: 12px; flex: 0 0 15px; text-align: center; line-height: 1.5;
  }
  .crit.met { color: var(--ink); }
  .crit.met .mark { color: var(--ok); }
  .crit.unmet .mark { color: var(--ink-3); }
  .crit.problem { color: var(--bad); }
  .crit.problem .mark { color: var(--bad); }
  .check-note { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-2); opacity: .9; }

  .progress-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }

  /* ---------- certificate ---------- */
  .cert {
    border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface);
    padding: 34px 30px; text-align: center; position: relative; overflow: hidden;
  }
  .cert::before {
    content: ""; position: absolute; inset: 9px; border: 1px solid var(--line); border-radius: 8px; pointer-events: none;
  }
  .cert-org { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .cert-name { font-size: 27px; font-weight: 600; letter-spacing: -.02em; margin: 14px 0 4px; }
  .cert-skill { font-size: 16px; color: var(--ink-2); }
  .cert-level { margin: 18px 0 14px; }
  .cert-meta {
    display: flex; justify-content: center; gap: 26px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-top: 18px;
    padding-top: 16px; border-top: 1px solid var(--line);
  }

  /* ---------- credentials on login ---------- */
  .cred-grid { display: grid; gap: 9px; margin-top: 20px; }
  .cred-card {
    border: 1px dashed var(--line-strong); border-radius: 9px; padding: 11px 13px;
    background: var(--surface); text-align: left; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .cred-card:hover { border-color: var(--accent); border-style: solid; background: var(--accent-soft); }
  .cred-card .who-role { font-size: 12.5px; font-weight: 600; }
  .cred-card .who-cred { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .cred-card .use { font-size: 12px; color: var(--accent); font-weight: 500; white-space: nowrap; }

  .linkbtn {
    background: none; border: 0; padding: 0; font: inherit; color: var(--accent);
    text-align: left; text-decoration: underline; text-underline-offset: 2px;
    text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .linkbtn:hover { text-decoration-color: currentColor; }

  /* ---------- filter bar ---------- */
  .filter-bar {
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
    padding: 13px 15px; margin-bottom: 18px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  }
  .filter-bar .field { flex: 1 1 170px; min-width: 0; }
  .filter-bar .btn { flex: 0 0 auto; }
  @media (max-width: 560px) { .filter-bar .field { flex-basis: 100%; } .filter-bar .btn { width: 100%; justify-content: center; } }

  /* ---------- preview mode ---------- */
  .preview-bar {
    background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn);
    border-radius: 9px; padding: 9px 13px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .preview-bar .pv-label { font-size: 13px; font-weight: 500; }
  .preview-bar .pv-note { font-size: 12.5px; opacity: .85; }

  /* ---------- draft review ---------- */
  .ver { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .diff-col { border: 1px solid var(--line); border-radius: 9px; padding: 13px; background: var(--surface-2); }
  .diff-col.next { border-color: var(--ok); background: var(--ok-soft); }
  .diff-col h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 9px; }
  .diff-field { margin-bottom: 10px; font-size: 13.5px; }
  .diff-field:last-child { margin-bottom: 0; }
  .diff-field .fl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .diff-field.changed .fv { background: rgba(169,121,28,.16); border-radius: 3px; padding: 0 3px; }
  @media (max-width: 720px) { .diff-grid { grid-template-columns: 1fr; } }

  /* ---------- leaderboard ---------- */
  .lb-you { background: var(--accent-soft) !important; }
  .rank { font-family: var(--mono); font-size: 14px; color: var(--ink-3); width: 34px; }
  .rank.top { color: var(--star); font-weight: 600; }

  /* ---------- live leaderboard ---------- */
  .live-pill {
    display: inline-flex; align-items: center; gap: 5px; vertical-align: middle;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ok); background: var(--ok-soft); border-radius: 20px; padding: 2px 8px 2px 6px;
    font-weight: 600;
  }
  .live-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: beat 2s infinite; }
  @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .page-head h1 .live-pill { margin-left: 8px; position: relative; top: -3px; }

  .lb-move { animation: moved 2.4s ease-out; }
  @keyframes moved {
    0% { background: var(--ok-soft); }
    70% { background: var(--ok-soft); }
    100% { background: transparent; }
  }

  .roadmap-cols { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 22px; align-items: start; }
  .rail { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 22px; }
  .side-card {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2);
  }
  .side-board { margin: 0 -14px; }
  .side-board table { font-size: 12.5px; }
  .side-board th, .side-board td { padding: 6px 8px; }
  .side-board th:first-child, .side-board td:first-child { padding-left: 14px; }
  .side-board th:last-child, .side-board td:last-child { padding-right: 14px; }
  .side-board .rank { width: 20px; font-size: 12px; }

  .feed { display: flex; flex-direction: column; gap: 5px; min-height: 18px; }
  .feed-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--ink-2); line-height: 1.35; }
  .feed-row:not(.new) { opacity: .55; }
  .feed-row.new { color: var(--ink); animation: slidein .4s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .feed-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); margin-top: 6px; flex: 0 0 auto; }
  .feed-inline { flex-direction: row; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .feed-inline .feed-row:not(.new) { display: none; }

  /* ---------- onboarding ---------- */
  .onb-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .onb-step {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px 5px 7px; background: var(--surface);
  }
  .onb-step b {
    width: 19px; height: 19px; border-radius: 50%; background: var(--surface-3); color: var(--ink-2);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
  }
  .onb-step.go { font: inherit; font-size: 12.5px; cursor: pointer; }
  .onb-step.go:hover { border-color: var(--accent); color: var(--ink); }
  .onb-step.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .onb-step[aria-current="true"] { color: var(--ink); border-color: var(--accent); }
  .onb-step[aria-current="true"] b { background: var(--accent); color: var(--accent-ink); }
  .onb-step[data-done="true"] { color: var(--ok); border-color: var(--ok); }
  .onb-step[data-done="true"] b { background: var(--ok-soft); color: var(--ok); }

  .file-input {
    border: 1px dashed var(--line-strong); border-radius: 9px; padding: 13px;
    background: var(--surface-2); font-size: 13px; width: 100%; box-sizing: border-box;
    font-family: var(--sans); color: var(--ink-2);
  }
  .file-input::file-selector-button {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: 7px; padding: 6px 11px; font: inherit; font-size: 13px; margin-right: 11px; cursor: pointer;
  }
  .file-input::file-selector-button:hover { background: var(--surface-3); }

  .explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 20px; }
  .explain > div { border-top: 2px solid var(--line-strong); padding-top: 11px; }
  .explain b { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
  .explain p { font-size: 12.5px; color: var(--ink-2); }

  .cover-row { display: grid; grid-template-columns: 150px minmax(60px, 1fr) 44px; gap: 12px; align-items: center; font-size: 13.5px; }
  .cover-row .bar { height: 5px; }
  .cover-row .mono { text-align: right; }
  @media (max-width: 520px) { .cover-row { grid-template-columns: 1fr 40px; } .cover-row .bar { grid-column: 1 / -1; } }

  .match-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: start; }
  .match-role { font-size: 13px; font-weight: 500; padding-top: 3px; }
  .match-skills { display: flex; flex-wrap: wrap; gap: 5px; }
  @media (max-width: 560px) { .match-row { grid-template-columns: 1fr; gap: 5px; } }

  .picked { display: flex; flex-direction: column; gap: 3px; padding-left: 11px; border-left: 2px solid var(--line-strong); }
  .picked b { font-size: 13.5px; font-weight: 500; }

  .rank-by {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 13px; margin-bottom: 16px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
  }

  .rec-why {
    font-size: 14px; margin-bottom: 11px; padding-left: 11px;
    border-left: 2px solid var(--accent); color: var(--ink);
  }

  .rec-card {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 17px;
  }
  .rec-card.lead { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .rec-name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .rec-score { text-align: right; flex: 0 0 auto; }
  .rec-score b { display: block; font-size: 25px; font-weight: 500; line-height: 1; }
  .rec-score span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }

  /* ---------- weekly challenge ---------- */
  .ch-row { border: 1px solid var(--line); border-radius: 10px; padding: 13px; }

  /* The docked assistant takes 360px out of the page, so the rail has to react to the
     space the content actually has rather than to the width of the window. These sit
     after the base rules deliberately, since they share the same specificity. */
  @container (max-width: 880px) {
    .roadmap-cols { grid-template-columns: 1fr; }
    .rail { position: static; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    .rail .side-card { flex: 1 1 260px; }
  }
  @container (max-width: 540px) {
    .rail { flex-direction: column; align-items: stretch; }
  }

  /* ---------- study assistant ---------- */
  #sel-ask {
    position: fixed; z-index: 60; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink);
    border-radius: 7px; padding: 5px 10px; font-size: 12.5px; font-weight: 500;
    box-shadow: var(--shadow);
  }
  #tutor-launch {
    position: fixed; right: 20px; z-index: 50;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 22px; padding: 10px 17px;
    font-size: 14px; font-weight: 500; box-shadow: var(--shadow);
  }
  #tutor-launch .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
  #tutor-launch.locked { background: var(--surface-3); color: var(--ink-2); }
  /* Floating, the panel sits on top of whatever is behind it and used to read as two
     pages printed over each other. The scrim puts the page behind it deliberately. */
  #tutor-scrim {
    position: fixed; inset: 0; z-index: 54; border: 0; padding: 0;
    background: rgba(19, 23, 32, .34);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #tutor-scrim { background: rgba(0, 0, 0, .52); }
  }
  :root[data-theme="dark"] #tutor-scrim { background: rgba(0, 0, 0, .52); }

  #tutor-panel {
    position: fixed; right: 20px; z-index: 55; width: 380px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: min(620px, calc(100dvh - 40px));
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: 0 8px 34px rgba(19,23,32,.18); overflow: hidden;
  }
  /* Docked: a permanent right rail that reserves its own space instead of covering the page. */
  :root { --tutor-w: 360px; }
  #tutor-panel.docked {
    right: 0; top: 0; bottom: 0; width: var(--tutor-w);
    max-height: none; border-radius: 0; border-top: 0; border-right: 0; border-bottom: 0;
    box-shadow: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.tutor-docked #shell { padding-right: var(--tutor-w); }
  body.tutor-docked #mobilebar { padding-right: 0; }
  #tutor-panel header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; border-bottom: 1px solid var(--line); background: var(--surface-2);
  }
  #tutor-panel header b { font-size: 14px; }
  #tutor-sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  #tutor-log { flex: 1; overflow-y: auto; padding: 13px; display: flex; flex-direction: column; gap: 11px; }
  .t-msg { font-size: 13.5px; line-height: 1.55; max-width: 92%; }
  .t-msg.you {
    align-self: flex-end; background: var(--accent-soft); color: var(--ink);
    border-radius: 11px 11px 3px 11px; padding: 8px 11px;
  }
  .t-msg.bot { align-self: flex-start; color: var(--ink); }
  .t-msg.bot p { margin-bottom: 8px; }
  .t-msg.bot p:last-child { margin-bottom: 0; }
  .t-msg.bot code {
    font-family: var(--mono); font-size: 12.5px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
  }
  .t-msg.bot pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.5; margin: 0 0 8px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 10px; overflow-x: auto; white-space: pre;
  }
  .t-msg .t-quote {
    display: block; font-size: 12px; color: var(--ink-3); font-style: italic;
    border-left: 2px solid var(--line-strong); padding-left: 8px; margin-bottom: 6px;
  }
  .t-msg.err { color: var(--bad); font-size: 13px; }
  .t-empty { color: var(--ink-3); font-size: 13px; text-align: center; padding: 22px 10px; }
  .t-empty b { display: block; color: var(--ink-2); font-size: 13.5px; margin-bottom: 5px; }
  .t-locked {
    margin: 13px; padding: 13px; border-radius: 9px;
    background: var(--warn-soft); border: 1px solid var(--warn);
    color: var(--warn); font-size: 13px;
  }
  .t-locked b { display: block; margin-bottom: 4px; }
  #tutor-foot { border-top: 1px solid var(--line); padding: 11px 13px; background: var(--surface); }
  #tutor-quote { margin-bottom: 9px; }
  #tutor-quote blockquote {
    margin: 0 0 5px; font-size: 12.5px; color: var(--ink-2); font-style: italic;
    border-left: 2px solid var(--accent); padding-left: 9px;
    max-height: 56px; overflow: hidden;
  }
  #tutor-input {
    width: 100%; resize: none; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; line-height: 1.5; color: var(--ink);
  }
  #tutor-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .tutor-inline {
    border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 7px; padding: 4px 9px; font-size: 12.5px; color: var(--accent);
  }
  .tutor-inline:hover { background: var(--accent-soft); border-color: var(--accent); }

  @media (max-width: 560px) {
    #tutor-panel {
      right: 10px; left: 10px; width: auto;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      max-height: min(78dvh, calc(100dvh - 20px));
    }
    #tutor-launch { right: 14px; }
  }

  /* ---------- mobile ---------- */
  #mobilebar { display: none; }
  @media (max-width: 860px) {
    #sidebar { display: none; }
    #mobilebar {
      display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .mb-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
    .mb-nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 9px; }
    .mb-nav button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 20px;
      padding: 5px 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap;
    }
    .mb-nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    #auth { grid-template-columns: 1fr; }
    .auth-aside { padding: 26px 20px; gap: 22px; }
    .auth-claim { font-size: 22px; max-width: none; }
    .auth-points { display: none; }
    .auth-form-wrap { padding: 26px 16px 46px; }
    .page { padding: 20px 16px 56px; }
    .page-head h1 { font-size: 22px; }
    .skill-row { grid-template-columns: 1fr; align-items: flex-start; }
    .skill-right { width: 100%; justify-content: space-between; }
  }
  /* The rail has to drop below the roadmap before the table starts to squeeze. */
  @media (max-width: 1180px) {
    .roadmap-cols { grid-template-columns: 1fr; }
    .rail { position: static; flex-direction: row; flex-wrap: wrap; }
    .rail .side-card { flex: 1 1 260px; }
  }
  @media (max-width: 620px) {
    .rail { flex-direction: column; }
    .rec-head { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
    .rec-score { text-align: left; display: flex; align-items: baseline; gap: 6px; }
    .rec-score b { font-size: 20px; }
  }
  @media (max-width: 420px) {
    .auth-grid { grid-template-columns: 1fr; }
    .cert { padding: 24px 16px; }
    .cert-name { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- Journey theme: shared components ----------
     Buttons, chips, progress, focus and press states, from the design handoff.
     Kept in one block at the end so every earlier rule still applies and this only
     changes the look. */
  .btn {
    border-radius: var(--radius-btn); border: 1px solid var(--line-strong);
    font-weight: 700; padding: 9px 16px;
    transition: background .15s ease, border-color .15s ease, filter .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary {
    padding: 11px 22px; box-shadow: 0 3px 0 var(--press);
  }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.1); }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--press); }
  .btn.ghost { border-color: transparent; }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
  .btn.sm.primary { padding: 7px 14px; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-btn); }
  .pill, .live-pill { border-radius: 99px; }
  .pill { font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; }
  .bar > span { border-radius: 99px; transition: width .3s ease; }
  .field input, .field select, .ex-input { border-radius: var(--radius-btn); }
  .card, .q-card, .ch-row, .skill-list, .summary-row { border-radius: var(--radius); }
  .opt, .tile, .side-card { transition: border-color .15s ease, background .15s ease, transform .15s ease; }
  a { text-underline-offset: 2px; }

  /* ---------- Journey theme: screens ---------- */
  body {
    background-image: radial-gradient(900px 340px at 88% -90px, var(--accent-soft), transparent 70%);
    background-repeat: no-repeat;
  }
  .brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.03em; }
  .brand-name span { color: var(--accent); }
  .brand-mark { border-radius: 9px; box-shadow: 0 2px 0 var(--press); }

  /* top bar */
  #sidebar { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
  .nav-item { border-radius: 99px; font-weight: 600; padding: 7px 14px; }
  .nav-item[aria-current="true"] { font-weight: 700; }
  .nav-count { border-radius: 99px; }
  .avatar { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
  .avatar.lg { width: 64px; height: 64px; flex-basis: 64px; font-size: 21px; }
  .who { border-radius: 99px; }
  .who-name { font-weight: 700; }
  .mb-nav button { font-weight: 600; }

  /* page heads */
  .page-head h1 { font-size: 32px; }
  .page-head .eyebrow, .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .1em; }
  .page-head .sub { font-size: 15.5px; line-height: 1.65; }
  @media (max-width: 860px) { .page-head h1 { font-size: 26px; } }
  .profile-head { display: flex; align-items: center; gap: 16px; }
  .chip-ok {
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px;
    padding: 6px 12px; border-radius: 99px;
  }

  /* stat cards instead of one ruled strip */
  .summary-row { background: none; border: 0; overflow: visible; gap: 10px; }
  .summary-cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .summary-cell .k { font-weight: 700; letter-spacing: .07em; }
  .summary-cell .v {
    font-family: var(--sans); font-weight: 800; font-size: 26px; letter-spacing: -.03em;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .summary-cell .v small { font-weight: 600; font-size: 13px; letter-spacing: 0; }

  /* landing */
  #auth { background: transparent; }
  .auth-aside {
    background:
      radial-gradient(520px 420px at 78% 24%, var(--accent-soft), transparent 70%),
      transparent;
    color: var(--ink); padding: 34px 44px; gap: 28px;
  }
  .auth-aside .brand-mark { background: var(--accent); color: var(--accent-ink); }
  .auth-aside .brand-name { color: var(--ink); }
  .auth-hero { position: relative; max-width: 480px; }
  .tag-pill {
    display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 700;
    font-size: 12px; padding: 5px 12px; border-radius: 99px;
  }
  .auth-claim { font-size: 52px; font-weight: 800; letter-spacing: -.04em; line-height: 1.02; max-width: none; margin: 18px 0 16px; }
  .auth-claim em { color: var(--accent); opacity: 1; }
  .auth-sub { font-size: 16px; line-height: 1.65; color: var(--ink-2); max-width: 430px; }
  .auth-example {
    width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 16px; box-shadow: var(--shadow); transform: rotate(-1.5deg); margin-top: 26px;
  }
  .auth-example .ex-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  .auth-example .ex-name { font-weight: 800; margin: 6px 0 10px; }
  .auth-example .ex-meta { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .auth-points { opacity: 1; color: var(--ink-2); font-weight: 600; }
  .auth-points b { color: var(--accent); opacity: 1; font-family: var(--mono); }
  .auth-form-wrap { background: var(--surface); border-left: 1px solid var(--line); }
  .tabs { border-radius: var(--radius-btn); }
  .tabs button { border-radius: 9px; font-weight: 700; }
  .cred-card { border-radius: var(--radius-btn); }
  @media (max-width: 1100px) { .auth-claim { font-size: 42px; } }
  @media (max-width: 860px) {
    .auth-aside { padding: 24px 20px; }
    .auth-claim { font-size: 36px; max-width: none; margin: 14px 0; }
    .auth-form-wrap { border-left: 0; border-top: 1px solid var(--line); }
  }

  /* role picker */
  .role-card {
    border: 2px solid var(--line); border-radius: 16px; background: transparent; padding: 16px 18px; gap: 6px;
    transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); box-shadow: 0 4px 0 var(--accent); }
  .role-card:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--accent); }
  .role-card h3 { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
  .role-ico {
    width: 36px; height: 36px; border-radius: 11px; background: var(--surface); color: var(--accent);
    display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-bottom: 4px;
    border: 1px solid var(--line);
  }
  .role-card:hover .role-ico { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* journey map */
  .journey {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 18px 22px 20px; margin-bottom: 14px;
  }
  .journey-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .journey-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.025em; }
  .journey-map { position: relative; width: 100%; margin: 6px 0 4px; }
  .journey-map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .jm-track, .jm-done { fill: none; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .jm-track { stroke: var(--line-strong); opacity: .6; }
  .jm-done { stroke: var(--accent); }
  .jm-node {
    position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: 120px; color: var(--ink);
  }
  .jm-dot {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 800;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .jm-label {
    position: absolute; top: calc(50% + 28px); font-size: 12px; font-weight: 700; line-height: 1.25; text-align: center;
    background: var(--surface); padding: 1px 6px; border-radius: 8px; width: max-content; max-width: 116px;
  }
  .jm-node.current .jm-label { top: calc(50% + 36px); }
  .jm-node.done .jm-dot { background: var(--accent); color: var(--accent-ink); }
  .jm-node.current .jm-dot {
    width: 54px; height: 54px; background: var(--bg); border: 3px solid var(--accent); color: var(--accent);
    box-shadow: 0 0 0 8px var(--accent-soft);
  }
  .jm-node.todo .jm-dot { background: var(--surface); border: 1px dashed var(--ink-2); color: var(--ink-2); }
  .jm-node.todo .jm-label { color: var(--ink-2); font-weight: 600; }
  .jm-node:hover .jm-dot { transform: scale(1.08); }
  .jm-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 14px; }
  .journey .bar { margin-top: 18px; }
  @container (max-width: 640px) {
    .journey-map { display: none; }
    .journey .bar { margin-top: 14px; }
  }

  /* skill list and module rows */
  .skill-list { border-radius: var(--radius-lg); }
  .skill-row { transition: background .15s ease; }
  .skill-row:hover { background: var(--accent-soft); }
  .skill-name { font-weight: 700; }
  .opt.mod { border-radius: var(--radius-btn); border-width: 1px; font-weight: 600; padding: 9px 14px; align-items: center; }
  .opt.mod .key { border-radius: 50%; width: 24px; height: 24px; flex-basis: 24px; background: var(--surface-2); border: 0; margin: 0; font-family: var(--sans); font-weight: 700; }
  .opt.mod.is-done .key { background: var(--accent); color: var(--accent-ink); }
  .opt.mod.is-current { border: 2px solid var(--accent); background: var(--accent-soft); padding: 8px 13px; }
  .opt.mod.is-current .key { background: var(--surface); color: var(--accent); }

  /* progress in segments */
  .segs { display: flex; gap: 6px; margin-bottom: 18px; }
  .segs i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); transition: background .2s ease; }
  .segs i.on { background: var(--accent); }
  .lesson-nav { gap: 8px; }
  .lesson-nav button { border-radius: 99px; font-weight: 600; padding: 6px 14px; }
  .lesson-nav button.done { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  /* lessons read like pages */
  .prose { font-size: 16px; line-height: 1.7; }
  .prose p { color: var(--ink); }
  .card.prose, .q-card { border-radius: var(--radius-lg); padding: 22px 24px; }

  /* quiz tiles */
  .q-stem { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-bottom: 16px; }
  .q-card .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @container (max-width: 720px) { .q-card .opts { grid-template-columns: 1fr; } }
  .opt {
    border: 2px solid var(--line); background: transparent; border-radius: var(--radius); padding: 14px 16px;
    font-weight: 600; align-items: center;
    transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(:disabled):not(.mod) { border-color: var(--accent); background: var(--accent-soft); }
  button.opt:not(.mod):active { transform: translateY(2px); }
  .opt .key { border-color: var(--line-strong); font-family: var(--sans); font-weight: 700; border-radius: 7px; }
  .opt[data-state="chosen"], .opt[data-state="correct"] {
    border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 4px 0 var(--accent);
  }
  .opt[data-state="chosen"] .key, .opt[data-state="correct"] .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  /* A wrong answer stays neutral: no red, just not highlighted. */
  .opt[data-state="wrong"] { border-color: var(--ink-3); background: var(--surface-2); color: var(--ink-2); }
  .why { border-radius: var(--radius); background: var(--accent-soft); color: var(--ink); }
  .ex { border-radius: var(--radius); }
  .check-panel, .hint { border-radius: var(--radius-btn); }

  /* results */
  .result-head { text-align: center; }
  .result-h1 { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .result-h1 .big { font-size: 96px; font-weight: 800; letter-spacing: -.05em; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .result-h1 .rest { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .result-head .sub { max-width: 640px; margin-left: auto; margin-right: auto; }
  @media (max-width: 640px) { .result-h1 .big { font-size: 68px; } .result-h1 .rest { font-size: 19px; } }

  /* the assistant */
  #tutor-panel { border-radius: var(--radius-lg); background: var(--surface); border-color: var(--line); box-shadow: 0 10px 40px rgba(20,24,26,.16); }
  #tutor-panel.docked { border-radius: 0; box-shadow: none; border-left: 1px solid var(--line); }
  #tutor-panel header { background: var(--surface); }
  #tutor-panel header b { font-weight: 800; font-size: 15px; }
  .t-msg { line-height: 1.55; }
  .t-msg.you {
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
    border-radius: 14px 14px 4px 14px; padding: 9px 13px;
  }
  .t-msg.bot {
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px;
    padding: 10px 13px; max-width: 94%;
  }
  .t-msg .t-quote { border-left-color: var(--accent); }
  #tutor-input { border-radius: var(--radius-btn); background: var(--bg); }
  #tutor-launch { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 3px 0 var(--press); }
  ::selection { background: var(--accent-soft); color: var(--ink); }
</style>
</head>
<body>
<button id="sel-ask" hidden>Ask about this</button>

<div id="tutor" hidden>
  <div id="tutor-scrim" data-tutor="close" hidden></div>
  <button id="tutor-launch" aria-expanded="false">
    <span class="dot"></span><span id="tutor-launch-label">Ask</span>
  </button>

  <section id="tutor-panel" hidden aria-label="Study assistant">
    <header>
      <div>
        <b>Study assistant</b>
        <span id="tutor-sub"></span>
      </div>
      <div class="row" style="gap:4px;flex-wrap:nowrap">
        <button class="btn sm ghost" data-tutor="clear">Clear</button>
        <button class="btn sm ghost" data-tutor="dock" id="tutor-dock" hidden>Dock</button>
        <button class="btn sm ghost" data-tutor="undock" id="tutor-undock" hidden>Hide</button>
        <button class="btn sm ghost" data-tutor="close" id="tutor-close" hidden>Close</button>
      </div>
    </header>

    <div id="tutor-log"></div>

    <div id="tutor-foot">
      <div id="tutor-quote" hidden>
        <span class="fl">Asking about</span>
        <blockquote id="tutor-quote-text"></blockquote>
        <button class="btn sm ghost" data-tutor="unquote">Remove</button>
      </div>
      <form id="tutor-form">
        <textarea id="tutor-input" rows="2" placeholder="Ask about this module" spellcheck="false"></textarea>
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <span class="tiny muted" id="tutor-note">Answers come from Claude. Select any text in the lesson to ask about it.</span>
          <span class="row" style="gap:6px;flex-wrap:nowrap">
            <button type="button" class="btn sm" id="tutor-stop" hidden>Stop</button>
            <button type="submit" class="btn sm primary" id="tutor-send">Ask</button>
          </span>
        </div>
      </form>
    </div>
  </section>
</div>

<div id="auth" hidden></div>

<div id="shell" hidden>
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="mobilebar"></div>
    <div id="view" class="page"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="data6.js"></script>
<script src="onboard.js"></script>
<script src="app.js"></script>
</body>
</html>
